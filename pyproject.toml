[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-recovery"
version = "0.1.0"
description = "Hermes autonomous recovery agent for failed SaaS subscription payments (Case 1 vertical slice)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
