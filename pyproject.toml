[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-recovery"
version = "0.1.0"
description = "Hermes autonomous recovery agent for failed SaaS subscription payments (Case 1 vertical slice)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Runtime-spike (slice 2) extra. NOT a default dependency: the 57-test suite
# plus the offline Hermes-strategist tests install nothing from here.
#
# Shipped path is direct google-genai (Gemini 3.7 Flash) - the Hermes-Agent
# library path was not taken; see HANDOFF.md Iteration 06. If Hermes-Agent is
# retried later, pin the tag v2026.8.31 *commit* (not the annotated-tag object):
#   hermes-agent @ git+https://github.com/NousResearch/hermes-agent@29112bef099274229cadff79cdff7bf7b99c4b77
# and note that `pip install` of it fails on Windows without
# `git config --global core.longpaths true` (MAX_PATH in the repo's docs tree).
gemini = [
  "google-genai==2.22.0",  # exact version the spike transport was written and probed against
  "python-dotenv==1.0.1",  # scripts/hermes_smoke.py loads a local .env; verified on py3.12
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
