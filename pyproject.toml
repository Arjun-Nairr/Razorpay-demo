[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-recovery"
version = "0.1.0"
description = "Hermes autonomous recovery agent for failed SaaS subscription payments (Case 1 vertical slice)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Runtime-spike (slice 2) extra. NOT a default dependency: the 57-test suite
# plus the offline Hermes-strategist tests install nothing from here.
#
# Shipped path is direct google-genai (Gemini 3.7 Flash) - the Hermes-Agent
# library path was not taken; see HANDOFF.md Iteration 06. If Hermes-Agent is
# retried later, pin the tag v2026.8.31 *commit* (not the annotated-tag object):
#   hermes-agent @ git+https://github.com/NousResearch/hermes-agent@29112bef099274229cadff79cdff7bf7b99c4b77
# and note that `pip install` of it fails on Windows without
# `git config --global core.longpaths true` (MAX_PATH in the repo's docs tree).
gemini = [
  "google-genai==2.22.0",  # exact version the spike transport was written and probed against
  "python-dotenv==1.0.1",  # scripts/hermes_smoke.py loads a local .env; verified on py3.12
]
# Slice 3: FastAPI signed simulated Razorpay ingress. NOT a default dependency;
# the API tests (tests/test_api.py) pytest.importorskip and skip without this
# extra. Versions verified this iteration on Python 3.12: the full suite is
# green against fastapi 0.117.1 (project env) and, in an isolated venv, against
# fastapi 0.141.1 - the pin below is the one the recorded run used.
api = [
  "fastapi==0.117.1",
  "httpx==0.28.1",  # required by fastapi.testclient.TestClient
  "uvicorn==0.37.0",  # local ASGI server: uvicorn hermes.asgi:app
]
# Slice 4: durable ledger. psycopg 3 (binary wheel for a no-toolchain Windows
# install), verified this iteration (project env has psycopg 3.3.4). The
# Postgres-backed store is only touched in live mode / opt-in integration tests.
db = [
  "psycopg[binary]==3.3.4",
]
# Local demo UI (Streamlit through the FastAPI backend). Not installed or
# import-verified this iteration; range-pinned. The user installs it for the
# live demo; the offline suite never imports it.
ui = [
  "streamlit>=1.37,<2",
  "requests>=2.32,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
